services:
  sybase:
    build: ./docker/sybase
    image: shortener-sybase:local
    container_name: shortener-sybase
    hostname: MYSYBASE
    privileged: true
    security_opt:
      - seccomp:unconfined
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      SYBASE_USER: sa
      SYBASE_PASSWORD: myPassword
      LD_POINTER_GUARD: "0"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'timeout 1 bash -c \"cat < /dev/null > /dev/tcp/127.0.0.1/5000\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 240s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: shortener-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: shortener-app
    depends_on:
      redis:
        condition: service_healthy
      sybase:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_DATASOURCE_URL: jdbc:sybase:Tds:sybase:5000/master
      APP_DATASOURCE_USERNAME: sa
      APP_DATASOURCE_PASSWORD: myPassword
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: 6379
      APP_JWT_SECRET: "change-this-to-a-64-char-production-secret-key-value-please"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

volumes:
  redis-data:

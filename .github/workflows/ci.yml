name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit and integration tests
        run: ./mvnw -B test

      - name: Package application
        run: ./mvnw -B -DskipTests package

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Sybase driver present for Docker build
        run: |
          mkdir -p lib
          if [ ! -f lib/jconn4.jar ]; then
            echo "jconn4.jar missing from checkout" >&2
            ls -la lib || true
            exit 1
          fi

      - name: Build application image
        run: docker build -t agentic-url-shortener:ci .
